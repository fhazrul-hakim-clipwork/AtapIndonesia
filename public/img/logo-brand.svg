<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background shield -->
  <rect x="2" y="2" width="56" height="56" rx="10" fill="url(#bgGrad)"/>

  <!-- Roof / Atap shape -->
  <path d="M 8 38 L 30 16 L 52 38 Z" fill="url(#roofGrad)" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- House body -->
  <rect x="16" y="34" width="28" height="18" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Door -->
  <rect x="26" y="42" width="8" height="10" fill="#1e293b"/>

  <!-- Window -->
  <rect x="18" y="38" width="6" height="6" fill="#fbbf24"/>
  <rect x="36" y="38" width="6" height="6" fill="#fbbf24"/>

  <!-- Chimney -->
  <rect x="40" y="20" width="5" height="8" fill="#94a3b8"/>

  <!-- Text ATAP -->
  <text x="68" y="30" font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" letter-spacing="1">ATAP</text>
  <!-- Text INDONESIA -->
  <text x="68" y="50" font-family="Arial Black, sans-serif" font-size="14" font-weight="900" fill="url(#roofGrad)" letter-spacing="1">INDONESIA</text>
</svg>
